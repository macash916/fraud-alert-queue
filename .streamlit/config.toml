# Streamlit settings for the analyst app (no secrets here: those live in .env).
[client]
toolbarMode = "minimal"   # hide developer menus such as Deploy

[browser]
gatherUsageStats = false  # no usage telemetry sent to Streamlit

[server]
headless = true

# A plain, light theme so the app reads the same for everyone, whatever their system setting.
[theme]
base = "light"
primaryColor = "#2a78d6"            # the project blue used in every chart
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f3"
textColor = "#1f1f1d"
