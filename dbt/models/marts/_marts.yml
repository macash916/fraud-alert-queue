version: 2

models:
  - name: fct_transaction_features
    description: >
      Model features, one row per transaction, using only information available before
      that transaction. Read by training, scoring and the alert queue.
    columns:
      - name: trans_num
        data_tests: [unique, not_null]
      - name: card_token
        data_tests: [not_null]
      - name: txn_count_1h
        description: Card's transactions in the hour before this one.
        data_tests: [not_null]
      - name: txn_count_24h
        description: Card's transactions in the 24 hours before this one.
        data_tests: [not_null]
      - name: amt_sum_24h
        description: Card's spend in the 24 hours before this one.
        data_tests: [not_null]
      - name: prior_txn_count
        description: Number of earlier transactions on this card. Tells the model how much history the ratios rest on.
        data_tests: [not_null]
      - name: amt_vs_avg
        description: This amount divided by the card's average over all earlier transactions. Null on a card's first transaction.
      - name: distance_km
        data_tests: [not_null]
      - name: is_new_merchant
        description: 1 if this card has not been used at this merchant before.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: secs_since_last
        description: Seconds since this card's previous transaction. Null on a card's first.
      - name: amt_vs_category_avg
        description: This amount divided by the average of all earlier payments in the same category, across all cards.
      - name: is_new_category
        description: 1 if this card has not been used in this category before.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: hour_band_share
        description: Share of the card's earlier payments in the same 4-hour time-of-day band. Low means an unusual hour for this customer.
      - name: small_txn_count_24h
        description: Payments under $20 on this card in the previous 24 hours (card testing).
        data_tests: [not_null]
      - name: spend_24h_vs_daily_avg
        description: (Previous 24h spend + this amount) divided by the card's average daily spend so far.
      - name: is_fraud
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: fct_rules_baseline
    description: >
      Analyst-style rules baseline, one row per transaction. Flags each rule and routes the
      payment to analyst review, in-app step-up or approve (stronger treatment wins).
    columns:
      - name: trans_num
        data_tests: [unique, not_null]
      - name: rules_route
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["analyst_review", "step_up", "approve"]

  - name: rpt_rules_baseline_performance
    description: Rules baseline volumes, hit rate, recall and fraud value caught, by period and route.
